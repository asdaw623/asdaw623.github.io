  const stroke = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const ICONS = {
    discord: fill("M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"),
    roblox: fill("M18.926 23.998 0 18.892 5.075.002 24 5.108ZM15.348 10.09l-5.282-1.453-1.414 5.273 5.282 1.453z"),
    youtube: fill("M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"),
    github: fill("M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"),
    link: stroke('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'),
  };
  const END_GO = stroke('<path d="M7 7h10v10"/><path d="M7 17 17 7"/>');
  const END_COPY = stroke('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>');

  const toastEl = $("#toast");
  let toastTimer = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms || 2200);
  }

  let entered = false;   // enter screen was clicked
  let revealed = false;  // profile content is showing

  function fallbackAvatar(name) {
    const ch = (Array.from((name || "?").trim())[0] || "?")
      .toUpperCase().replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">` +
      `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">` +
      `<stop offset="0" stop-color="#3b4357"/><stop offset="1" stop-color="#0b0e16"/></linearGradient></defs>` +
      `<rect width="200" height="200" fill="url(#g)"/>` +
      `<text x="100" y="104" text-anchor="middle" dominant-baseline="middle" ` +
      `font-family="Geist, 'Noto Sans KR', sans-serif" font-size="96" font-weight="700" fill="#f3f5fa">${ch}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  function setImg(img, src, fallback) {
    img.onerror = () => { img.onerror = null; img.src = fallback; };
    img.src = src || fallback;
  }

  /* Profile */
  const fullName = C.name || "";
  const nameEl = $("#name");
  const cut = fullName.lastIndexOf("_");
  if (cut > 0 && cut < fullName.length - 1) {
    nameEl.textContent = fullName.slice(0, cut);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = fullName.slice(cut);
    nameEl.appendChild(tag);
  } else {
    nameEl.textContent = fullName;
  }
  $("#bio").textContent = C.bio || "";
  if (!C.bio) $("#bio").hidden = true;
  const avatarFallback = fallbackAvatar(fullName);
  setImg($("#avatar"), C.avatar, avatarFallback);
  $("#avatar").alt = fullName + " 프로필 사진";
  if (C.skyMoon === false) $("#skyMoon").hidden = true;

  const statusEl = $("#status");
  if (C.status && C.status.text) {
    $("#statusText").textContent = C.status.text;
    if (C.status.color) statusEl.style.setProperty("--status", C.status.color);
  } else {
    statusEl.hidden = true;
  }

  /* Links */
  const linksEl = $("#links");
  (C.links || []).forEach((l) => {
    const isCopy = typeof l.copy === "string" && l.copy;
    const el = document.createElement(isCopy ? "button" : "a");
    el.className = "link";
    el.innerHTML =
      `<span class="ico">${ICONS[l.icon] || ICONS.link}</span>` +
      `<span class="lbl"></span>` +
      `<span class="end ${isCopy ? "end-copy" : "end-go"}">${isCopy ? END_COPY : END_GO}</span>`;
    el.querySelector(".lbl").textContent = l.label || l.icon;
    if (isCopy) {
      el.type = "button";
      el.title = `${l.copy} · 클릭해서 복사`;
      el.setAttribute("aria-label", `${l.label} 아이디 복사 (${l.copy})`);
      el.addEventListener("click", () => {
        const shown = () => toast(`${l.label} 아이디: ${l.copy}`, 4000);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(l.copy).then(
            () => toast(`${l.label} 아이디 복사됨: ${l.copy}`),
            shown
          );
        } else {
          shown();
        }
      });
    } else {
      el.href = l.url || "#";
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    }
    linksEl.appendChild(el);
  });
  if (!linksEl.children.length) linksEl.hidden = true;

  /* Theme */
  const themeBtn = $("#themeBtn");
  let rainRGB = "190, 205, 235";
  let rainStrength = 1;
  function currentTheme() {
    const t = root.dataset.theme;
    if (t === "light" || t === "dark") return t;
    return prefersLight.matches ? "light" : "dark";
  }
  function syncTheme() {
    const cs = getComputedStyle(root);
    rainRGB = cs.getPropertyValue("--rain").trim() || rainRGB;
    rainStrength = parseFloat(cs.getPropertyValue("--rain-strength")) || 1;
    const light = currentTheme() === "light";
    themeBtn.classList.toggle("is-light", light);
    themeBtn.setAttribute("aria-label", light ? "다크 모드로" : "라이트 모드로");
    if (reduceMotion) drawRain(0);
  }
  themeBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    storeSet("profile-theme", next);
  });
  new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  if (prefersLight.addEventListener) prefersLight.addEventListener("change", syncTheme);

  /* Rain: drops that land on top of the card splash, then keep falling below it */
  const rainCfg = Object.assign({ enabled: true, density: 1, wind: -0.12, splash: true }, C.rain || {});
  const canvas = $("#rain");
  const ctx = canvas.getContext("2d");
  const wind = rainCfg.wind;
  let W = 0, H = 0, drops = [], splashes = [];
  let shelter = null;

  function resetDrop(d, anywhere) {
    const z = Math.random();
    const spread = H * Math.abs(wind);
    d.x = Math.random() * (W + spread) - (wind > 0 ? spread : 0);
    d.y = anywhere ? Math.random() * H : -Math.random() * 120 - 20;
    d.len = 10 + z * 24;
    d.v = 420 + z * 720;
    d.a = 0.05 + z * 0.22;
    d.w = 0.6 + z * 0.9;
    return d;
  }
  function resizeRain() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W * H) / 9000 * rainCfg.density);
    drops = Array.from({ length: n }, () => resetDrop({}, true));
    splashes = [];
    if (reduceMotion) drawRain(0);
  }
  function spawnSplash(x, y) {
    if (splashes.length > 240) return;
    const n = 2 + ((Math.random() * 2) | 0);
    for (let i = 0; i < n; i++) {
      splashes.push({
        x: x, y: y - 1,
        vx: (Math.random() - 0.5) * 150 + wind * 160,
        vy: -(70 + Math.random() * 110),
        t: 0, life: 0.25 + Math.random() * 0.2,
        r: 0.6 + Math.random() * 0.7,
      });
    }
  }
  function drawRain(dt) {
    if (!rainCfg.enabled || !W) return;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round";
    const s = shelter;
    for (const d of drops) {
      if (dt) {
        const prevY = d.y;
        d.y += d.v * dt;
        d.x += d.v * wind * dt;
        if (s && prevY < s.top && d.y >= s.top && d.x > s.left + 16 && d.x < s.right - 16) {
          if (Math.random() < 0.6) spawnSplash(d.x, s.top);
          d.y = s.bottom + (d.y - s.top);
        }
        if (d.y - d.len > H) resetDrop(d, false);
      }
      ctx.strokeStyle = `rgba(${rainRGB}, ${d.a * rainStrength})`;
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * wind, d.y - d.len);
      ctx.stroke();
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const p = splashes[i];
      if (dt) {
        p.t += dt;
        p.vy += 900 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      if (p.t >= p.life) { splashes.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${rainRGB}, ${(1 - p.t / p.life) * 0.55 * rainStrength})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (rainCfg.enabled) window.addEventListener("resize", resizeRain);
  else canvas.hidden = true;

  /* Card edge light */
  const wrap = $("#cardWrap");
  const card = $("#card");
  const glow = { a: 180, p: 0, ta: 180, tp: 0 };
  let pointerSeen = false;

  window.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    pointerSeen = true;
    const r = card.getBoundingClientRect();
    const x = e.clientX, y = e.clientY;
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    glow.ta = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
    const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    if (inside) {
      const edge = Math.min(x - r.left, r.right - x, y - r.top, r.bottom - y);
      glow.tp = 1 - Math.min(edge / 140, 1);
    } else {
      const ox = Math.max(r.left - x, 0, x - r.right);
      const oy = Math.max(r.top - y, 0, y - r.bottom);
      glow.tp = 1 - Math.min(Math.hypot(ox, oy) / 220, 1);
    }
    card.style.setProperty("--inside", inside ? 1 : 0);
    card.style.setProperty("--mx", ((x - r.left) / r.width) * 100 + "%");
    card.style.setProperty("--my", ((y - r.top) / r.height) * 100 + "%");
  }, { passive: true });

  window.addEventListener("mouseout", (e) => {
    if (!e.relatedTarget) {
      glow.tp = 0;
      card.style.setProperty("--inside", 0);
    }
  });

  function updateGlow(dt) {
    if (!canHover && !pointerSeen && revealed) {
      glow.tp = 0.6;
      if (!reduceMotion) glow.ta = (glow.ta + 50 * dt) % 360;
    }
    const k = 1 - Math.exp(-dt * 10);
    const diff = ((glow.ta - glow.a + 540) % 360) - 180;
    glow.a = (glow.a + diff * k + 360) % 360;
    glow.p += (glow.tp - glow.p) * k;
    wrap.style.setProperty("--angle", glow.a.toFixed(2) + "deg");
    wrap.style.setProperty("--prox", glow.p.toFixed(3));
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    shelter = (revealed && rainCfg.splash) ? card.getBoundingClientRect() : null;
    if (rainCfg.enabled && !reduceMotion) drawRain(dt);
    updateGlow(dt);
    requestAnimationFrame(frame);
  }

  /* Enter screen: the crescent fills into a full moon, then the moon opens like an iris */
  const enter = $("#enter");
  const veil = $("#enterVeil");
  const enterMoon = $("#enterMoon");
  $("#enterText").textContent = C.enterText || "눌러주세요";

  function reveal() {
    if (revealed) return;
    revealed = true;
    body.classList.add("entered");
  }

  function doEnter() {
    if (entered) return;
    entered = true;
    const m = enterMoon.getBoundingClientRect();
    veil.style.setProperty("--cx", (m.left + m.width / 2) + "px");
    veil.style.setProperty("--cy", (m.top + m.height / 2) + "px");
    enter.classList.add("opening");
    setTimeout(() => {
      veil.style.transition = "none";
      veil.style.setProperty("--hole", (m.width / 2) + "px");
      void veil.offsetWidth;
      veil.style.transition = "";
      veil.style.setProperty("--hole", Math.ceil(Math.hypot(window.innerWidth, window.innerHeight)) + "px");
      enter.classList.add("gone");
      reveal();
      setTimeout(() => enter.remove(), reduceMotion ? 60 : 1400);
    }, reduceMotion ? 0 : 450);
  }

  syncTheme();
  if (rainCfg.enabled) resizeRain();
  requestAnimationFrame(frame);

  if (C.enterScreen === false) {
    enter.remove();
    entered = true;
    requestAnimationFrame(reveal);
  } else {
    enter.addEventListener("click", doEnter);
    enter.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doEnter(); }
    });
    enter.focus({ preventScroll: true });
  }
})();
</script>
</body>
</html>
